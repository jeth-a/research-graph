<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Research Graph</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Top bar: search, layout, actions -->
  <header class="topbar">
    <div class="brand">Research Graph <span id="vault-name" class="muted"></span></div>
    <div class="search-box">
      <input id="search" type="search" placeholder="Search names and attributes…  (Enter = zoom to results)" />
      <span id="search-count" class="muted small"></span>
    </div>
    <label class="inline small">Layout
      <select id="layout"></select>
    </label>
    <button id="run-layout" class="btn" title="Arrange the visible nodes again">Re-arrange</button>
    <button id="fit" class="btn" title="Zoom to show everything">Fit</button>
    <button id="new-note" class="btn primary">+ New note</button>
    <span id="status" class="status" title="Live connection to the notes folder">● connecting</span>
  </header>

  <main>
    <!-- Left: how things look and what is shown -->
    <aside id="sidebar">
      <div id="warnings" class="error" hidden></div>
      <details open>
        <summary>Show / hide</summary>
        <div id="filters" class="panel"></div>
      </details>
      <details open>
        <summary>Node style</summary>
        <div id="node-style" class="panel"></div>
      </details>
      <details>
        <summary>Edge style</summary>
        <div id="edge-style" class="panel"></div>
      </details>
      <details open>
        <summary>Labels</summary>
        <div id="labels" class="panel"></div>
      </details>
      <details>
        <summary>Save / share these settings</summary>
        <div class="panel">
          <p class="hint">Styles, filters and labels are remembered in this browser for this notes folder.</p>
          <button id="export-settings" class="btn">Export…</button>
          <button id="import-settings" class="btn">Import…</button>
          <button id="reset-settings" class="btn">Reset to defaults</button>
        </div>
      </details>
    </aside>

    <!-- Middle: the graph -->
    <div id="cy"></div>

    <!-- Right: details and editing of the selection -->
    <aside id="inspector"></aside>
  </main>

  <!-- "New note" dialog -->
  <dialog id="new-note-dialog">
    <form method="dialog" id="new-note-form">
      <h2>New note</h2>
      <label>Name (also the file name)<input name="name" required autocomplete="off" /></label>
      <label>Folder<input name="folder" list="dl-folders" autocomplete="off" placeholder="(vault root)" /></label>
      <label>node_type<input name="node_type" list="dl-node-types" autocomplete="off" placeholder="optional" /></label>
      <div id="link-from-row" hidden>
        <label><span>Link from <b id="link-from-name"></b> with relationship type</span>
          <input name="link_type" list="dl-edge-types" autocomplete="off" value="related" />
        </label>
        <label><span>…and back from the new note with type (optional)</span>
          <input name="reverse_type" list="dl-edge-types" autocomplete="off" placeholder="e.g. part_of_paper" />
        </label>
      </div>
      <p class="hint">Creates a Markdown file with a small frontmatter block. Add more in the app or in Obsidian.</p>
      <div class="dialog-buttons">
        <button value="cancel" class="btn" formnovalidate>Cancel</button>
        <button value="create" class="btn primary">Create</button>
      </div>
    </form>
  </dialog>

  <!-- Suggestion lists for text boxes (filled in by main.js) -->
  <datalist id="dl-attr-keys"></datalist>
  <datalist id="dl-edge-types"></datalist>
  <datalist id="dl-note-links"></datalist>
  <datalist id="dl-folders"></datalist>
  <datalist id="dl-node-types"></datalist>

  <!-- Cytoscape (graph drawing library), served from node_modules -->
  <script src="/vendor/cytoscape.min.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
